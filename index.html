<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>बोलपथ — हिंदी से मराठी</title>
<meta name="description" content="A Hindi to Marathi phrasebook. Instant, offline, written by a speaker of both.">
<meta name="theme-color" content="#f7f1e6">
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Tiro+Devanagari+Marathi&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Two Devanagari faces on purpose: Marathi and Hindi draw a few letters
     differently (ल, श, the reph), and Tiro ships a face tuned for each.
     Marathi gets the larger type because it is the answer. */
  :root {
    --paper: #f7f1e6;
    --card: #fffdf8;
    --ink: #1f1a17;
    --ink-2: #6b625b;
    --ink-3: #a39a92;
    --kunku: #b7381e;
    --rule: rgba(31, 26, 23, 0.12);
    --hi: 'Tiro Devanagari Hindi', 'Noto Sans Devanagari', serif;
    --mr: 'Tiro Devanagari Marathi', 'Noto Sans Devanagari', serif;
    --ui: 'Inter', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--ui); }
  body { min-height: 100dvh; display: flex; flex-direction: column; }

  header {
    padding: 1.2rem 1.1rem 0.6rem;
    display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
  }
  h1 { margin: 0; font-family: var(--mr); font-weight: 400; font-size: 1.7rem; line-height: 1; }
  h1 small { font-family: var(--ui); font-size: 0.78rem; color: var(--ink-2); letter-spacing: 0.02em; margin-left: 0.5rem; }
  .count { font-size: 0.8rem; color: var(--ink-3); white-space: nowrap; }

  .search {
    position: sticky; top: 0; z-index: 10;
    background: var(--paper);
    padding: 0.4rem 1.1rem 0.8rem;
    border-bottom: 1px solid var(--rule);
  }
  .search input {
    width: 100%;
    font: 1.35rem/1.3 var(--hi);
    padding: 0.7rem 0.9rem;
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    background: var(--card);
    color: var(--ink);
    outline: none;
  }
  .search input:focus { border-color: var(--kunku); box-shadow: 0 0 0 3px rgba(183, 56, 30, 0.12); }
  .search input::placeholder { color: var(--ink-3); }

  .chips { display: flex; gap: 0.4rem; overflow-x: auto; padding: 0.6rem 0 0; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; font: 500 0.8rem/1 var(--ui);
    padding: 0.45rem 0.75rem; border-radius: 999px;
    border: 1px solid var(--rule); background: var(--card); color: var(--ink-2);
    cursor: pointer; letter-spacing: 0.02em; text-transform: capitalize;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  main { flex: 1; padding: 0.6rem 1.1rem 4rem; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.55rem; }

  .phrase {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 0.8rem 0.95rem 0.75rem;
    display: grid; gap: 0.15rem;
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  .phrase:active { transform: scale(0.99); }
  .hi { font: 1rem/1.4 var(--hi); color: var(--ink-2); }
  .mr { font: 1.55rem/1.35 var(--mr); color: var(--ink); }
  .mr mark { background: none; color: var(--kunku); }
  .hi mark { background: none; color: var(--ink); font-weight: 500; }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 0.35rem; }
  .note { font-size: 0.8rem; color: var(--ink-3); font-style: italic; }
  .tier { font-style: normal; font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); border: 1px solid var(--rule); border-radius: 3px; padding: 0.05rem 0.3rem; }
  .say {
    font: 500 0.78rem var(--ui); color: var(--kunku);
    background: none; border: none; padding: 0.2rem 0; cursor: pointer; letter-spacing: 0.03em;
  }
  .say[disabled] { color: var(--ink-3); }

  .empty { color: var(--ink-2); padding: 2rem 0.5rem; text-align: center; line-height: 1.5; font-size: 0.95rem; }
  .empty b { font-family: var(--hi); font-weight: 400; font-size: 1.1rem; display: block; margin-bottom: 0.3rem; }

  footer { padding: 0.8rem 1.1rem 1.4rem; font-size: 0.75rem; color: var(--ink-3); border-top: 1px solid var(--rule); display: flex; justify-content: space-between; }
  footer a { color: inherit; }

  @media (prefers-reduced-motion: reduce) { .phrase { transition: none; } }
</style>
</head>
<body>

<header>
  <h1>बोलपथ <small>Hindi → Marathi</small></h1>
  <span class="count" id="count"></span>
</header>

<div class="search">
  <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
         placeholder="हिंदी में लिखिए… or type in roman" aria-label="Search phrases">
  <div class="chips" id="chips"></div>
</div>

<main>
  <ol id="results"></ol>
  <p class="empty" id="empty" hidden></p>
</main>

<footer>
  <span id="status">Works offline once loaded</span>
  <a href="./phrases.csv">phrases.csv</a>
</footer>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let phrases = [];
  let situation = null;

  // --- data ---------------------------------------------------------------

  async function sheet(name) {
    const res = await fetch(name, { cache: 'no-cache' }).catch(() => null);
    return res && res.ok ? parseCSV(await res.text()) : [];
  }

  // Two tiers. phrases.csv is hand-written and checked; corpus.csv is drawn
  // from open parallel corpora and marked as such. Curated rows rank first.
  async function load() {
    const [curated, corpus] = await Promise.all([sheet('./phrases.csv'), sheet('./corpus.csv')]);
    phrases = [
      ...curated.map(p => ({ ...p, tier: 'curated' })),
      ...corpus.map(p => ({ ...p, tier: 'corpus', status: 'corpus' })),
    ].map(p => ({ ...p, _hi: norm(p.hindi), _mr: norm(p.marathi), _ro: norm(p.roman) }));
    const n = curated.length, m = corpus.length;
    $('count').textContent = m ? `${n} phrases + ${m} from corpora` : `${n} phrases`;
    buildChips(curated);
    render();
  }

  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', quoted = false;
    for (let i = 0; i < text.length; i += 1) {
      const c = text[i];
      if (quoted) {
        if (c === '"' && text[i + 1] === '"') { field += '"'; i += 1; }
        else if (c === '"') quoted = false;
        else field += c;
      } else if (c === '"') quoted = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i += 1;
        row.push(field); rows.push(row); row = []; field = '';
      } else field += c;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    const [head, ...body] = rows.filter(r => r.some(v => v.trim()));
    return body.map(r => Object.fromEntries(head.map((h, i) => [h.trim(), (r[i] ?? '').trim()])));
  }

  // --- search -------------------------------------------------------------

  // Normalise so that nukta, zero-width joiners and case differences don't
  // block a match. People type Devanagari loosely.
  function norm(s) {
    return (s || '')
      .normalize('NFC')
      .replace(/[\u093c\u200b-\u200d\ufeff]/g, '')
      .replace(/[?।!,.]/g, '')
      .toLowerCase()
      .trim();
  }

  function bigrams(s) {
    const out = new Set();
    for (let i = 0; i < s.length - 1; i += 1) out.add(s.slice(i, i + 2));
    return out;
  }

  function similarity(a, b) {
    if (a.length < 2 || b.length < 2) return 0;
    const A = bigrams(a), B = bigrams(b);
    let hit = 0;
    for (const g of A) if (B.has(g)) hit += 1;
    return (2 * hit) / (A.size + B.size);
  }

  // Shared leading characters — कितना and कितने agree on कितन. Inflection in
  // both languages lives at the end of the word, so a prefix match catches
  // most of what a typist means.
  function prefixLen(a, b) {
    let i = 0;
    while (i < a.length && i < b.length && a[i] === b[i]) i += 1;
    return i;
  }

  function score(p, q) {
    if (!q) return 1;
    const fields = [p._hi, p._ro, p._mr];
    let best = 0;
    for (const f of fields) {
      if (!f) continue;
      if (f.startsWith(q)) return 3;
      if (f.includes(q)) best = Math.max(best, 2);
      for (const w of f.split(/\s+/)) {
        if (w.startsWith(q)) best = Math.max(best, 2.5);
        const pl = prefixLen(w, q);
        if (pl >= 3 && pl >= q.length * 0.6) best = Math.max(best, 1.5);
        best = Math.max(best, similarity(w, q));
      }
    }
    return best;
  }

  function search(q) {
    const nq = norm(q);
    return phrases
      .filter(p => !situation || p.situation === situation)
      .map(p => ({ p, s: score(p, nq) * (p.tier === 'corpus' ? 0.85 : 1) }))
      .filter(x => x.s >= 0.4)
      .sort((a, b) => b.s - a.s)
      .map(x => x.p);
  }

  // --- render -------------------------------------------------------------

  function buildChips(curated) {
    const sits = [...new Set(curated.map(p => p.situation).filter(Boolean))];
    $('chips').replaceChildren(...sits.map(s => {
      const b = document.createElement('button');
      b.className = 'chip'; b.type = 'button'; b.textContent = s;
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', () => {
        situation = situation === s ? null : s;
        for (const c of $('chips').children) c.setAttribute('aria-pressed', String(c.textContent === situation));
        render();
      });
      return b;
    }));
  }

  function highlight(text, q) {
    if (!q) return esc(text);
    const i = norm(text).indexOf(norm(q));
    if (i < 0) return esc(text);
    // Map normalised index back approximately by searching raw text.
    const raw = text.toLowerCase().indexOf(q.toLowerCase());
    if (raw < 0) return esc(text);
    return esc(text.slice(0, raw)) + '<mark>' + esc(text.slice(raw, raw + q.length)) + '</mark>' + esc(text.slice(raw + q.length));
  }

  function render() {
    const q = $('q').value;
    const hits = search(q);
    $('empty').hidden = hits.length > 0;
    if (!hits.length) {
      $('empty').innerHTML = `<b>कुछ नहीं मिला</b>Nothing for “${esc(q)}”${situation ? ` in ${esc(situation)}` : ''}. Try fewer words.`;
    }
    $('results').replaceChildren(...hits.map(p => {
      const li = document.createElement('li');
      li.className = 'phrase';
      li.innerHTML = `
        <div class="hi" lang="hi">${highlight(p.hindi, q)}</div>
        <div class="mr" lang="mr">${highlight(p.marathi, q)}</div>
        <div class="meta">
          <span class="note">${p.tier === 'corpus' ? `<span class="tier">${esc(p.source || 'corpus')}</span> ` : ''}${esc(p.note || '')}</span>
          <button class="say" type="button" aria-label="Speak Marathi">▶ बोला</button>
        </div>`;
      const say = () => speak(p.marathi, li.querySelector('.say'));
      li.querySelector('.say').addEventListener('click', e => { e.stopPropagation(); say(); });
      li.addEventListener('click', say);
      return li;
    }));
  }

  // --- speech -------------------------------------------------------------

  function pickVoice() {
    const voices = speechSynthesis.getVoices();
    return voices.find(v => /^mr/i.test(v.lang))
        || voices.find(v => /^hi/i.test(v.lang))
        || null;
  }

  function speak(text, btn) {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'mr-IN';
    u.rate = 0.92;
    if (btn) { btn.disabled = true; u.onend = u.onerror = () => { btn.disabled = false; }; }
    speechSynthesis.speak(u);
  }

  // --- wiring -------------------------------------------------------------

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  let t;
  $('q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(render, 40); });
  $('q').focus();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then(() => {
      $('status').textContent = 'Saved for offline use';
    }).catch(() => {});
  }

  load();
})();
</script>
</body>
</html>
