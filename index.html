<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>बोलपथ — हिंदी से मराठी</title>
<meta name="description" content="Hindi, roman or English into Marathi. Runs on the phone, offline once downloaded.">
<meta name="theme-color" content="#f7f1e6">
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Tiro+Devanagari+Marathi&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Two Devanagari faces on purpose: Marathi and Hindi draw a few letters
     differently (ल, श, the reph), and Tiro ships a face tuned for each.
     Marathi gets the larger type because it is the answer. */
  :root {
    --paper: #f7f1e6;
    --card: #fffdf8;
    --ink: #1f1a17;
    --ink-2: #6b625b;
    --ink-3: #a39a92;
    --kunku: #b7381e;
    --rule: rgba(31, 26, 23, 0.12);
    --hi: 'Tiro Devanagari Hindi', 'Noto Sans Devanagari', serif;
    --mr: 'Tiro Devanagari Marathi', 'Noto Sans Devanagari', serif;
    --ui: 'Inter', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--ui); }
  body { min-height: 100dvh; display: flex; flex-direction: column; }

  header {
    padding: 1.2rem 1.1rem 0.5rem;
    display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
  }
  h1 { margin: 0; font-family: var(--mr); font-weight: 400; font-size: 1.7rem; line-height: 1; }
  h1 small { font-family: var(--ui); font-size: 0.78rem; color: var(--ink-2); letter-spacing: 0.02em; margin-left: 0.5rem; }
  .net { font-size: 0.75rem; color: var(--ink-3); white-space: nowrap; }

  main { flex: 1; padding: 0 1.1rem 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; }

  textarea {
    width: 100%; min-height: 6.5rem; resize: vertical;
    font: 1.3rem/1.45 var(--hi);
    padding: 0.8rem 0.9rem;
    border: 1.5px solid var(--ink); border-radius: 6px;
    background: var(--card); color: var(--ink); outline: none;
  }
  textarea:focus { border-color: var(--kunku); box-shadow: 0 0 0 3px rgba(183, 56, 30, 0.12); }
  textarea::placeholder { color: var(--ink-3); font-family: var(--ui); font-size: 0.95rem; }

  .reading {
    display: flex; align-items: center; flex-wrap: wrap; gap: 0.4rem;
    font-size: 0.78rem; color: var(--ink-2);
  }
  .reading b { font-weight: 500; color: var(--ink); }
  .chip {
    font: inherit; font-size: 0.75rem;
    padding: 0.25rem 0.6rem; border-radius: 999px;
    border: 1px solid var(--rule); background: transparent; color: var(--ink-2);
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .unsure { color: var(--kunku); }

  .out {
    background: var(--card); border: 1px solid var(--rule); border-radius: 8px;
    padding: 1rem; min-height: 5.5rem;
    display: flex; flex-direction: column; gap: 0.6rem;
  }
  .mr { font-family: var(--mr); font-size: 1.65rem; line-height: 1.45; overflow-wrap: anywhere; }
  .via { font-family: var(--hi); font-size: 0.95rem; color: var(--ink-3); overflow-wrap: anywhere; }
  .idle { color: var(--ink-3); font-family: var(--ui); font-size: 0.9rem; }
  .row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  button.act {
    font: inherit; font-size: 0.85rem; padding: 0.4rem 0.8rem;
    border: 1px solid var(--ink); border-radius: 6px;
    background: transparent; color: var(--ink); cursor: pointer;
  }
  button.act:disabled { opacity: 0.4; cursor: default; }
  button.act.primary { background: var(--kunku); border-color: var(--kunku); color: #fff; }

  .pack {
    border: 1px solid var(--rule); border-radius: 8px; padding: 0.8rem 0.9rem;
    display: flex; flex-direction: column; gap: 0.55rem; font-size: 0.85rem;
    background: var(--card);
  }
  .pack h2 { margin: 0; font-size: 0.85rem; font-weight: 500; }
  .pack p { margin: 0; color: var(--ink-2); font-size: 0.8rem; line-height: 1.5; }
  .bar { height: 5px; border-radius: 3px; background: var(--rule); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--kunku); transition: width 0.2s; }
  .done { color: var(--ink-2); }
  .done::before { content: '✓ '; color: var(--kunku); }

  footer { padding: 0 1.1rem 1.5rem; font-size: 0.72rem; color: var(--ink-3); line-height: 1.6; }
</style>
</head>
<body>

<header>
  <h1>बोलपथ <small>हिंदी · roman · English → मराठी</small></h1>
  <span class="net" id="net"></span>
</header>

<main>
  <textarea id="q" rows="3" autofocus
    placeholder="हिंदी, roman (kitna hai), or English"></textarea>

  <div class="reading" id="reading" hidden>
    <span>read as</span>
    <button class="chip" type="button" data-lang="hi" aria-pressed="false">हिंदी</button>
    <button class="chip" type="button" data-lang="roman" aria-pressed="false">roman</button>
    <button class="chip" type="button" data-lang="en" aria-pressed="false">English</button>
    <span id="unsure" class="unsure" hidden>not sure — pick one</span>
  </div>

  <div class="out" id="out">
    <div class="idle" id="idle">Marathi appears here.</div>
    <div class="mr" id="mr" lang="mr" hidden></div>
    <div class="via" id="via" lang="hi" hidden></div>
    <div class="row" id="actions" hidden>
      <button class="act" type="button" id="say">▶ बोला</button>
      <button class="act" type="button" id="copy">copy</button>
    </div>
  </div>

  <div class="pack" id="pack" hidden>
    <h2 id="packName"></h2>
    <p id="packWhy"></p>
    <div class="bar" id="packBar" hidden><i id="packFill"></i></div>
    <div class="row">
      <button class="act primary" type="button" id="packGet"></button>
    </div>
  </div>
</main>

<footer id="foot"></footer>

<script type="module" src="./app.js"></script>
</body>
</html>
